  setSheet("");toast(addc.length?"Saved. Your circles have been notified.":"Saved. Your circle has been notified.");await load()}
 else if(a==="delplan"){var dpid=b.dataset.p,dpl=plans.find(function(x){return x.id===dpid})||{},dcn=counts[dpid]||{};
  if(dpl.cancelled_at){if(confirm("Remove this cancelled activity for everyone?")){var d1=await sb.from("plans").delete().eq("id",dpid);if(d1.error)throw d1.error;await load()}}
  else if((dcn.going||0)+(dcn.maybe||0)>0){cancelSheet(dpid)}
  else if(confirm("Delete this activity for everyone?")){var dp=await sb.from("plans").delete().eq("id",dpid);if(dp.error)throw dp.error;await load()}}
 else if(a==="cancelplan"){var cr=await sb.rpc("cancel_plan",{p_plan:b.dataset.p,p_keep:b.dataset.k==="1"});if(cr.error)throw cr.error;setSheet("");
  toast(cr.data==="handover"?"Cancelled. People who were going have been told, and can keep it going for an hour.":cr.data==="cancelled"?"Cancelled. Everyone who replied has been told.":"Deleted.");await load()}
 else if(a==="keepplan"){var kr=await sb.rpc("keep_plan_going",{p_plan:b.dataset.p});if(kr.error)throw kr.error;toast("It's yours now. Tap Edit to change anything. The others have been told.");await load()}
 else if(a==="undocancel"){var ur2=await sb.rpc("restore_plan",{p_plan:b.dataset.p});if(ur2.error)throw ur2.error;toast("Back on. People who replied have been told.");await load()}
 }catch(e){toast("That didn't save: "+(e.message||"error"))}
}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b)act(b)});
</script>
