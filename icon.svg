  <circle cx="30" cy="268" r="56" fill="#2EC4B6" opacity=".7"/>
  <circle cx="92" cy="196" r="22" fill="#fff" opacity=".8"/>
  <circle cx="84" cy="440" r="84" fill="#B8F2A5" opacity=".8"/>
  <circle cx="160" cy="470" r="38" fill="#FFD166" opacity=".9"/>
  <circle cx="448" cy="440" r="90" fill="#FF8FAB" opacity=".75"/>
  <circle cx="380" cy="486" r="34" fill="#FFD166" opacity=".9"/>
